<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel da Escala Infantil</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="container">

        <header>

            <div class="logo">​🙏​🙏​</div>

            <h1>Painel da Escala</h1>

            <p>Monte a escala do Culto Infantil</p>

        </header>

        <section class="card">

            <label>Mês</label>

            <select id="mesAdmin">

                <option value="2026-01">Janeiro</option>
                <option value="2026-02">Fevereiro</option>
                <option value="2026-03">Março</option>
                <option value="2026-04">Abril</option>
                <option value="2026-05">Maio</option>
                <option value="2026-06">Junho</option>
                <option value="2026-07">Julho</option>
                <option value="2026-08" selected>Agosto</option>
                <option value="2026-09">Setembro</option>
                <option value="2026-10">Outubro</option>
                <option value="2026-11">Novembro</option>
                <option value="2026-12">Dezembro</option>

            </select>

        </section>

        <section class="card">

    <h2>Resumo do mês</h2>

    <div class="cardsResumo">

        <div class="resumo">

            <h3 id="totalParticipantes">0</h3>

            <p>Participantes</p>

        </div>

        <div class="resumo">

            <h3 id="totalCultos">0</h3>

            <p>Cultos</p>

        </div>

        <div class="resumo">

            <h3 id="cultosMontados">0/0</h3>

            <p>Escalas prontas</p>

        </div>

    </div>
    <div class="card">

    <h2>Disponibilidades</h2>

    <div id="listaDisponibilidades"></div>
    </div>

<div class="card">

    <h2>⚠ Dias sem disponibilidade</h2>

    <div id="diasSemDisponibilidade"></div>

</div>
<div class="card">
    <button id="gerarSugestao">
        ✨ Gerar Sugestão
    </button>
</div>
</section>

        <section class="card">

            <h2>Escala do Mês</h2>

            <div id="escala"></div>

        </section>

        <section class="card">
            <button id="salvarEscala">
                💾 Salvar Escala
            </button>
            <button id="exportarImagem" style="margin-top:15px;">
                🖼 Exportar como Imagem
            </button>

        </section>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script type="module" src="admin.js"></script>

</body>

</html>
