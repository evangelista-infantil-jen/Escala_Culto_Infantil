<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Escala do Culto Infantil</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="LOgo2.png">

</head>

<body>

    <div class="container">

        <header>

            <div class="logo">
                <img src="IEQLogo.png" alt="Descrição da imagem">
            </div>

            <h1>Escala do Culto Infantil</h1>

            <p>
                Escolha os domingos em que você poderá servir.
            </p>

        </header>

        <section class="card">

            <label>
                Seu nome
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome">

            <label>
                Mês
            </label>

            <select id="mes">

                <option>Janeiro</option>
                <option>Fevereiro</option>
                <option>Março</option>
                <option>Abril</option>
                <option>Maio</option>
                <option>Junho</option>
                <option>Julho</option>
                <option selected>Agosto</option>
                <option>Setembro</option>
                <option>Outubro</option>
                <option>Novembro</option>
                <option>Dezembro</option>

            </select>

            <h2>Selecione sua disponibilidade</h2>
            <div id="calendario"></div>

            <button id="salvar">
                💾 Salvar Disponibilidade
            </button>

        </section>

        <footer>

            Deus abençoe seu ministério ❤️

        </footer>

    </div>

<script type="module" src="script.js"></script>

</body>

</html>
